      <circle cx="498" cy="70"  r="6" fill="#74add1"/><circle cx="498" cy="95"  r="6" fill="#fdae61"/><circle cx="498" cy="120" r="6" fill="#e34a33"/><circle cx="498" cy="145" r="6" fill="#fdae61"/><circle cx="498" cy="170" r="6" fill="#74add1"/>
