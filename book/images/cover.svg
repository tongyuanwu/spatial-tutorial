<svg width="100%" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>Geospatial Data Analysis &amp; Mapping in Python</title>
  <desc>A wireframe globe with a latitude-coloured temperature scatter beside the book title.</desc>
  <defs>
