    <clipPath id="panel"><rect x="0" y="0" width="680" height="240" rx="14"/></clipPath>
    <clipPath id="globe"><circle cx="548" cy="120" r="88"/></clipPath>
  </defs>

  <g clip-path="url(#panel)">
