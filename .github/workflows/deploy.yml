name: deploy-book

# Build the Jupyter Book and publish it to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the GitHub Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Jupyter Book v1 is pure Python/Sphinx — no Node required.
      - name: Install Jupyter Book v1
        run: pip install "jupyter-book<2"

      # execute_notebooks is "off" in _config.yml, so this only renders the
      # cached notebook outputs — the geospatial stack is NOT needed here.
      - name: Build the book
        run: jupyter-book build book

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
